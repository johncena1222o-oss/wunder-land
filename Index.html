
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEON UNIVERSE ✨</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  min-height: 100vh;
  background: radial-gradient(circle at top, #24105a, #080817 65%);
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
  overflow-x: hidden;
}

.stars {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
}

.star {
  position: absolute;
  background: white;
  border-radius: 50%;
  animation: twinkle 2s infinite alternate;
}

@keyframes twinkle {
  from { opacity: .2; }
  to { opacity: 1; }
}

main {
  position: relative;
  z-index: 1;
  padding: 100px 20px 50px;
}

h1 {
  font-size: clamp(38px, 9vw, 75px);
  background: linear-gradient(90deg, #00f0ff, #bd55ff, #ff65c5);
  background-clip: text;
  -webkit-background-clip: text;
  color: transparent;
  text-shadow: 0 0 35px #a53cff55;
}

p {
  color: #c9c5e8;
  margin: 20px 0;
  font-size: 18px;
}

button {
  padding: 16px 30px;
  margin: 12px;
  border: 1px solid #a855ff;
  border-radius: 30px;
  color: white;
  background: #792cff55;
  font-size: 17px;
  cursor: pointer;
  transition: .3s;
}

button:hover {
  background: #a855ff;
  box-shadow: 0 0 30px #a855ff;
  transform: scale(1.08);
}

#message {
  margin-top: 35px;
  font-size: 24px;
  color: #72faff;
  min-height: 70px;
}

.orb {
  font-size: 85px;
  margin: 35px;
  animation: float 3s ease-in-out infinite;
  filter: drop-shadow(0 0 25px #9d55ff);
}

@keyframes float {
  50% { transform: translateY(-20px) rotate(10deg); }
}

footer {
  color: #777;
  margin-top: 80px;
  font-size: 13px;
}
</style>
</head>

<body>

<div class="stars" id="stars"></div>

<main>
  <div class="orb">🌌</div>

  <h1>NEON UNIVERSE</h1>

  <p>Willkommen in einer anderen Dimension.</p>
  <p>Deine kleine Ecke im Internet. ✨</p>

  <button onclick="surprise()">
    🎁 Überrasch mich!
  </button>

  <button onclick="changeColor()">
    🌈 Farbwechsel
  </button>

  <div id="message">
    Das Universum wartet auf dich ...
  </div>

  <footer>
    Made with ✨ imagination
  </footer>
</main>

<script>
const stars = document.getElementById("stars");

for (let i = 0; i < 120; i++) {
  const star = document.createElement("div");
  star.className = "star";
  star.style.left = Math.random() * 100 + "%";
  star.style.top = Math.random() * 100 + "%";
  star.style.width = Math.random() * 3 + 1 + "px";
  star.style.height = star.style.width;
  star.style.animationDelay = Math.random() * 3 + "s";
  stars.appendChild(star);
}

const messages = [
  "✨ Du bist einzigartig!",
  "🚀 Willkommen in deiner eigenen Welt!",
  "🌌 Das ist erst der Anfang!",
  "💜 Träume können groß werden.",
  "⚡ Du hast gerade Magie freigeschaltet!",
  "🌟 Heute ist dein Tag!"
];

function surprise() {
  const random = Math.floor(Math.random() * messages.length);
  document.getElementById("message").textContent = messages[random];
}

const colors = [
  ["#24105a", "#080817"],
  ["#003b50", "#050b20"],
  ["#50103f", "#10051b"],
  ["#10452f", "#06120c"],
  ["#452000", "#100817"]
];

let colorIndex = 0;

function changeColor() {
  colorIndex = (colorIndex + 1) % colors.length;
  document.body.style.background =
    `radial-gradient(circle at top, ${colors[colorIndex][0]}, ${colors[colorIndex][1]} 65%)`;
}
</script>

</body>
</html>
